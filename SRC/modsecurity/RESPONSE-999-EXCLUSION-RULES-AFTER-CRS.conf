# Regras personalizadas executadas DEPOIS do OWASP Core Rule Set (CRS)
# Uteis para ajustar falsos positivos identificados no audit.log (ex: em Paranoia Level >= 2).
#
# Afinação cirurgica para Paranoia Level 2 no Guestbook (/vulnerabilities/xss_s/):
# Remove falsos positivos de regras SQLi (942131, 942200, 942260) apenas no campo de texto livre ARGS:mtxMessage,
# mantendo todas as regras de XSS (941xxx) ativas e preservando a protecao SQLi nos restantes endpoints.
SecRule REQUEST_URI "@beginsWith /vulnerabilities/xss_s/" \
    "id:100200,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=942131;ARGS:mtxMessage,\
    ctl:ruleRemoveTargetById=942200;ARGS:mtxMessage,\
    ctl:ruleRemoveTargetById=942260;ARGS:mtxMessage"

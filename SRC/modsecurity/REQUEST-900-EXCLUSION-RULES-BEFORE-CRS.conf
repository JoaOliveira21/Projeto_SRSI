# Regras personalizadas executadas ANTES do OWASP Core Rule Set (CRS)
# Uteis para definir excecoes de arranque ou regras de bloqueio/whitelisting especificas.
#
# Exemplo 1 - Regra de bloqueio customizada (descomentar para testar):
# SecRule ARGS:id "@rx (?i)(?:sleep\s*\(|benchmark\s*\()" \
#     "id:100100,phase:2,deny,status:403,log,msg:'SRSI Custom Rule: Time-based SQLi attempt'"
#
# Exemplo 2 - Remover uma regra especifica do CRS antes da avaliacao para um endpoint:
# SecRule REQUEST_URI "@beginsWith /vulnerabilities/xss_s/" \
#     "id:100101,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:mtxMessage"
